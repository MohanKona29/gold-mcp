[project]
name = "gold-mcp"
version = "4.0.0"
description = "MCP server for public gold (XAUUSD) market data with Free / Pro / Premium / Ultra tiers. Ultra tier adds SMC suite (order blocks, FVG, CHOCH/BOS, liquidity sweeps), regime classifier (Hurst + variance ratio), MTF confluence engine, position sizing (Kelly + optimal-f + risk-of-ruin), Monte Carlo simulator, BYOK AI analyst (Claude API), HTML tearsheet generator. Ed25519 offline license verification."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "gold-mcp contributors" }]
license = { text = "MIT" }
keywords = [
    "mcp", "model-context-protocol",
    "gold", "xauusd", "trading-data", "education",
    "claude", "chatgpt", "cursor", "windsurf",
]

dependencies = [
    "mcp[cli]>=1.2.0,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "yfinance>=0.2.40,<1.5.0",
    "numpy>=1.24.0,<3.0.0",
    "requests>=2.31.0,<3.0.0",
    "cryptography>=42.0.0,<46.0.0",
]

[project.optional-dependencies]
webhook = ["flask>=3.0.0,<4.0.0", "gunicorn>=21.0.0"]
ai = ["anthropic>=0.40.0,<1.0.0"]
dev = ["pytest>=7.0", "ruff>=0.1.0", "flask>=3.0.0,<4.0.0", "anthropic>=0.40.0,<1.0.0"]

[project.urls]
Homepage = "https://github.com/ThaiTrevor/gold-mcp"
Issues = "https://github.com/ThaiTrevor/gold-mcp/issues"
Changelog = "https://github.com/ThaiTrevor/gold-mcp/blob/main/CHANGELOG.md"

[project.scripts]
gold-mcp = "gold_mcp.server:main"
gold-mcp-license = "gold_mcp.issue_license:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gold_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
