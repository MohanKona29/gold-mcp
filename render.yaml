services:
  - type: web
    name: gold-mcp-webhook
    env: python
    region: singapore
    buildCommand: pip install -e ".[webhook]"
    startCommand: gunicorn "gold_mcp.webhook.lemonsqueezy:make_app()" -w 2 -b 0.0.0.0:$PORT
    envVars:
      - key: LEMONSQUEEZY_SIGNING_SECRET
        sync: false
      - key: LICENSE_PRIVATE_KEY_B64
        sync: false
      - key: LS_VARIANT_ID_PRO
        sync: false
      - key: LS_VARIANT_ID_PREMIUM
        sync: false
      - key: LS_VARIANT_ID_ULTRA
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
