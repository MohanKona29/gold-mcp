name: Feature request
description: Propose a new tool, an enhancement to an existing tool, or a new MCP client integration.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of change?
      options:
        - New tool
        - Enhancement to existing tool
        - New MCP client / integration
        - Docs / examples
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user pain does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Sketch the tool name, args, return shape, and where it would live in the package.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
